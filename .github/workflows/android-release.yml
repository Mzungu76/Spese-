name: Android release firmata

# Genera l'APK release FIRMATO. La firma usa esclusivamente i GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64   keystore (.jks) codificato in base64
#   ANDROID_KEYSTORE_PASSWORD password del keystore
#   ANDROID_KEY_ALIAS         alias della chiave
#   ANDROID_KEY_PASSWORD      password della chiave
# Nessuna credenziale è presente nel repository. Vedi docs/CI.md.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nome versione (es. 1.0.0). Con un tag v* viene ricavato dal tag."
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necessario solo per allegare l'APK alla GitHub Release quando si pubblica un tag

jobs:
  release:
    name: APK release firmato
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica dei segreti di firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ]  && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ]  && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ]  && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Segreti mancanti:$missing. Configurali in Settings > Secrets and variables > Actions (vedi docs/CI.md)."
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Pacchetti SDK richiesti
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Versione
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ github.event.inputs.version_name }}"; fi
          echo "name=${v:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Decodifica il keystore (solo nella cartella temporanea del runner)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "::add-mask::$RUNNER_TEMP/release.jks"

      - name: Test
        run: ./gradlew --stacktrace --no-daemon :core:common:test :domain:test :core:database:testDebugUnitTest :data:testDebugUnitTest :app:testDebugUnitTest

      - name: Compila e firma l'APK release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --stacktrace --no-daemon :app:assembleRelease

      - name: Verifica la firma
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          mv "$APK" "app/build/outputs/apk/release/gestione-spese-${{ steps.ver.outputs.name }}.apk"

      - name: Rimuove il keystore dal runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Pubblica l'APK firmato
        uses: actions/upload-artifact@v4
        with:
          name: gestione-spese-release-apk
          path: app/build/outputs/apk/release/gestione-spese-*.apk
          retention-days: 90
          if-no-files-found: error

      - name: GitHub Release (solo per i tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/gestione-spese-*.apk
          generate_release_notes: true
